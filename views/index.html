<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <link rel="stylesheet" href="/static/style.css">

</head>
<body>

    <div class="container">
        <h1>Post</h1>

        <!-- Post Creation Form -->
        <h2>Create a New Post</h2>
        <form id="postForm">
            <input type="text" id="title" name="title" placeholder="Enter Post Title" required>
            <textarea id="body" name="body" placeholder="Enter Post Content" required></textarea>
            <input type="text" id="taglist" name="taglist" placeholder="Enter Tags (comma separated)">
            <button type="submit">Create Post</button>
        </form>

        <!-- Post List -->
        <h2>All Posts</h2>
        <div id="postList"></div>
    </div>

    <script>
        document.getElementById('postForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const title = document.getElementById('title').value;
            const body = document.getElementById('body').value;
            const taglist = document.getElementById('taglist').value.split(',');

            const response = await fetch('/create-post', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, body, taglist })
            });

            if (response.ok) {
                alert('Post created successfully!');
                loadPosts();
                document.getElementById('postForm').reset();
            } else {
                alert('Failed to create post.');
            }
        });

        async function loadPosts() {
            const response = await fetch('/get-post');
            const data = await response.json();

            const postList = document.getElementById('postList');
            postList.innerHTML = '';

            data.user.forEach(post => {
                const postElement = document.createElement('div');
                postElement.classList.add('post-card');
                postElement.innerHTML = `
                    <h3>${post.title}</h3>
                    <p>${post.body}</p>
                    <p><strong>Tags:</strong> ${post.taglist.join(', ')}</p>
                `;
                postList.appendChild(postElement);
            });
        }

        window.onload = loadPosts;
    </script>

</body>
</html>
