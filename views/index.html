<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Posts</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Create a New Post</h1>
        <form id="postForm">
            <input type="text" id="title" name="title" placeholder="Enter Post Title" required><br>
            <textarea id="body" name="body" placeholder="Enter Post Content" required></textarea><br>
            <input type="text" id="taglist" name="taglist" placeholder="Enter Tags (comma separated)"><br>
            <button type="submit">Create</button>
        </form>
        
    </div>

    <script>
        document.getElementById('postForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const title = document.getElementById('title').value;
            const body = document.getElementById('body').value;
            const taglist = document.getElementById('taglist').value.split(',').map(tag => tag.trim());

            const response = await fetch('/create-post', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, body, taglist })
            });

            if (response.ok) {
                alert('Post created successfully!');
                window.location.href = "/allpost";  // Redirect to all posts after creation
            } else {
                alert('Failed to create post.');
            }
        });
    </script>
</body>
</html>
